name: Verify submission

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Materialize the checksum-pinned model once so parallel jobs do not stampede the upstream host.
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Publish only a fully verified model directory to dependent jobs through the workflow cache.
      - uses: actions/cache@v4
        with:
          path: models/Xenova/multilingual-e5-base
          key: nexo-model-${{ runner.os }}-${{ hashFiles('src/model-manifest.ts') }}
      - run: npm run setup:model
      - run: npm run verify:model

  # Wait for the shared model cache before exercising learned-mode quality checks.
  quality:
    needs: model
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run typecheck
      # Restore the model that the prerequisite job checksum-verified.
      - uses: actions/cache@v4
        with:
          path: models/Xenova/multilingual-e5-base
          key: nexo-model-${{ runner.os }}-${{ hashFiles('src/model-manifest.ts') }}
      # Learned-mode assertions require the checksum-pinned offline model before runtime initialization.
      - run: npm run setup:model
      - run: npm test
      - run: npm run self-check

  # Wait for the shared model cache before starting browser dependencies and tests.
  browser:
    needs: model
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Restore the model that the prerequisite job checksum-verified.
      - uses: actions/cache@v4
        with:
          path: models/Xenova/multilingual-e5-base
          key: nexo-model-${{ runner.os }}-${{ hashFiles('src/model-manifest.ts') }}
      - run: npm run setup:model
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/

  # Wait for the shared model cache before running the learned evaluation modes.
  evaluations:
    needs: model
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run degraded safety baseline
        run: |
          PORT=8080 LEARNED_SEMANTIC_ENABLED=false RUNTIME_STATE_PATH=/tmp/nexo-ci-evals node src/server.ts > /tmp/nexo-ci-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:8080/readyz > /tmp/nexo-ready.json; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/readyz
          CANDIDATE_BASE_URL=http://127.0.0.1:8080 npm run evals
          node --input-type=module -e "import report from '/tmp/candidate-eval-report.json' with { type: 'json' }; if (!report.safe) process.exit(1)"
      # Restore the model that the prerequisite job checksum-verified.
      - uses: actions/cache@v4
        with:
          path: models/Xenova/multilingual-e5-base
          key: nexo-model-${{ runner.os }}-${{ hashFiles('src/model-manifest.ts') }}
      - run: npm run setup:model
      - run: npm run test:extended
      - run: npm run evals:matrix

  submission:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify:submission
      - run: npm run export:candidate
      - run: cd dist && sha256sum --check nexo-atlantico-knowledge-case.tgz.sha256

  # Delay the clean Docker proof until the single upstream model materialization has finished.
  container:
    needs: model
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build without ignored local assets
        run: docker build --tag nexo-atlantico-knowledge-case:ci .
      - name: Start restricted container and verify readiness/latency
        run: |
          docker run --detach --name nexo-ci \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev \
            --tmpfs /state:rw,noexec,nosuid,nodev,uid=65532,gid=65532,mode=0700 \
            --user 65532:65532 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 256 \
            --memory 4g \
            --cpus 2 \
            --publish 8080:8080 \
            nexo-atlantico-knowledge-case:ci
          trap 'docker rm --force nexo-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:8080/readyz > /tmp/nexo-container-ready.json; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/readyz
          node scripts/verify-first-decision.ts http://127.0.0.1:8080 10000
